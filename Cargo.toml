[package]
name = "taffymeters"
version = "0.2.0"
edition = "2024"

[dependencies]
arc-swap = "1.7.1"
cpal = "0.17.3"
eframe = "0.34.1"
ringbuf = "0.4.8"
rustfft = "6.4.1"

[profile.release]
strip = true
lto = true
opt-level = "s"
panic = "abort"
codegen-units = 1

[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
strip = false
incremental = true
