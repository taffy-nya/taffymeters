[package]
name = "taffymeters"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Lightweight, customizable real-time audio visualizer for Windows"
license = "GPL-3.0-or-later"
repository = "https://github.com/taffy-nya/taffymeters"
publish = false

[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unseparated_literal_suffix = "warn"

[features]
automation = ["dep:image", "dep:sha2", "windows-sys/Win32_System_WindowsProgramming"]

[dependencies]
arc-swap = "1.7.1"
cpal = "0.17.3"
eframe = "0.34.1"
ringbuf = "0.4.8"
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
sha2 = { version = "0.10", optional = true }
realfft = "3"

[[test]]
name = "automation_core"
required-features = ["automation"]

[[test]]
name = "automation_crash"
required-features = ["automation"]

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
panic = "abort"
codegen-units = 1

[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
strip = false
incremental = true
