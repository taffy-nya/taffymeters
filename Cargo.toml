[package]
name = "taffymeters"
version = "0.2.0"
edition = "2024"

[features]
automation = ["dep:image", "dep:sha2", "windows-sys/Win32_System_Threading", "windows-sys/Win32_System_WindowsProgramming"]

[dependencies]
arc-swap = "1.7.1"
cpal = "0.17.3"
eframe = "0.34.1"
ringbuf = "0.4.8"
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
sha2 = { version = "0.10", optional = true }
realfft = "3"

[[test]]
name = "automation_core"
required-features = ["automation"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
panic = "abort"
codegen-units = 1

[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
strip = false
incremental = true
