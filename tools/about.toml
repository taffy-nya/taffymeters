# cargo-about configuration for THIRD_PARTY_LICENSES.txt; run through tools/package.py.
# Order is preference: for "A OR B" the first accepted license here is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
