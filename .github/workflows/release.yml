name: Release

# Manual runs only build the package (an artifact for a dry run); a pushed v* tag also
# creates a draft release from it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-about --locked --version 0.9.2 --features cli
      - run: python tools/package.py --out dist ${{ github.ref_type == 'tag' && format('--tag {0}', github.ref_name) || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: dist
      - run: >-
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag
          --title "$GITHUB_REF_NAME" --notes-file dist/release-notes.md
          dist/*.zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
